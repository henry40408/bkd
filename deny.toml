# cargo-deny configuration: supply-chain checks for the dependency graph.
# Run locally with `cargo deny check`; CI runs the same on every push and PR.

[graph]
# Check every target, not just the host's, so a platform-specific dependency cannot
# bring in a bad license or advisory.
all-features = true

[advisories]
version = 2
# Deny crates with a known security advisory (RUSTSEC) or that were yanked. `ignore`
# holds advisories that were reviewed and accepted; each entry says why it is safe here
# and what lets us drop it.
yanked = "deny"
ignore = [
    # libsqlite3-sys 0.37.0 bundles SQLite < 3.54.0, which can return uninitialized
    # memory when a database is opened together with a -wal file of a different page
    # size. Local attack only: the database path is chosen by the operator, and bkd has
    # no upload, restore or ATTACH feature. Fixed in libsqlite3-sys 0.39.1, but
    # sqlx-sqlite 0.9.0 requires <0.38.0. Drop once a sqlx release allows 0.39 and we
    # upgrade.
    "RUSTSEC-2026-0459",
]

[licenses]
version = 2
# Permissive licenses only. Check the active set with `cargo deny list`, and add a
# license here only after reviewing the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common: a warning, not a failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is trusted; an unknown registry or any git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
