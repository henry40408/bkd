# The binary entrypoint only runs in a live process (socket bind, signal
# handling), so leave it out of the coverage denominator. dbtest is test
# support: no test of its own runs it, and every test that opens a database
# already depends on it working.
ignore:
  - "cmd/bkd/main.go"
  - "internal/dbtest"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 70%
