name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time: a newer push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Replaces `cargo deny`: the licence allow-list below is enforced with
  # go-licenses.
  deps:
    name: deps
    runs-on: ubuntu-latest
    env:
      # The root module allows only these. `e2e/` additionally allows MPL-2.0
      # (godog pulls in go-immutable-radix, go-memdb and golang-lru); MPL-2.0
      # must not reach the root module, which ships in the image.
      ALLOWED_LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT-0,Zlib,Unlicense,CC0-1.0,Unicode-3.0,BSL-1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # go-licenses needs GOROOT set explicitly, else it fails on the standard
      # library with "does not have module info". The module's own LICENSE is
      # not a dependency, so it is ignored.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/bkd \
            --allowed_licenses="$ALLOWED_LICENSES"
      # `e2e/` is a separate Go module with its own vendor directory.
      - run: go mod tidy -diff
        working-directory: e2e
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
        working-directory: e2e
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: e2e
      # `--include_tests` because the Gherkin and browser libraries are test
      # dependencies of this module.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/bkd/e2e \
            --allowed_licenses="$ALLOWED_LICENSES,MPL-2.0"
        working-directory: e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          unformatted="$(git ls-files -z '*.go' | grep -zvE '(^|/)vendor/' | xargs -0 gofmt -l 2>&1)"
          echo "$unformatted"
          test -z "$unformatted"
      - run: go vet -mod=vendor ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go vet ./...
        working-directory: e2e
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
        working-directory: e2e
      # CI and the Dockerfile read the Go version from the root go.mod only, so
      # the nested module must not drift from it.
      - run: |
          root="$(grep -E '^(go|toolchain) ' go.mod)"
          nested="$(grep -E '^(go|toolchain) ' e2e/go.mod)"
          test "$root" = "$nested" || { echo "e2e/go.mod differs from go.mod:"; echo "$root"; echo "--"; echo "$nested"; exit 1; }

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...

  # Pushes mutate the whole module; pull requests only the lines changed
  # against the base branch. `e2e/` is a separate module with no coverage
  # profile, so gremlins would count its mutants as "not covered". `vendor/` is
  # not ours to mutate.
  #
  # Locally, run it with `GOMAXPROCS=4` and `--workers 2` under `nice -n 15`, so
  # the machine stays usable. Never pass `--test-cpu`: gremlins v0.6.0 hands
  # `go test` the single argument "-cpu 2", which fails every mutant's build,
  # and a failed build counts as KILLED.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--diff` needs the base branch's history, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Gremlins derives each mutant's timeout from how long its coverage run
      # took. A cached test result makes that near zero, so nearly every mutant
      # "times out", which the efficacy score ignores: the job would pass
      # without testing anything.
      - run: go clean -testcache
      - name: Mutate the whole module (push)
        if: github.event_name != 'pull_request'
        run: |
          # Stream the output so a killed runner still leaves a log. Two
          # workers keep the whole module within the runner's memory.
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            -E '^e2e/' -E '^vendor/' --workers 2 --threshold-efficacy 95 . \
            2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - name: Mutate the changed lines (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Stream the output so a killed runner still leaves a log, and limit
          # the workers as in the push run. `--test-cpu` is not used: v0.6.0
          # passes it to `go test` as the single argument "-cpu 2", which
          # fails every mutant's build and counts each one as killed.
          status=0
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --diff "origin/$BASE_REF" \
            -E '^e2e/' -E '^vendor/' --workers 2 --threshold-efficacy 95 . \
            2>&1 | tee "$RUNNER_TEMP/mutation.log" || status=$?
          set +o pipefail
          # A diff with no mutable Go line (docs, CI only) yields zero mutants,
          # which gremlins scores as 0% and so fails the threshold. That is not
          # a low score, so treat it as a pass.
          if [ "$status" -ne 0 ] \
            && grep -q '^Killed: 0, Lived: 0, Not covered: 0$' "$RUNNER_TEMP/mutation.log" \
            && grep -q '^Timed out: 0, ' "$RUNNER_TEMP/mutation.log"; then
            echo "No mutants in the changed lines; nothing to test."
            exit 0
          fi
          exit "$status"

  # Root module only: `e2e/` is its own module, so it is not measured.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `-coverprofile` ignores the binary cmd/bkd's TestMain execs; with
      # BKD_COVERDIR set it builds that binary with `-cover`.
      - run: |
          BKD_COVERDIR="$PWD/covdata" go test -mod=vendor -coverprofile=coverage.out ./...
          go tool covdata textfmt -i=covdata -o coverage-bin.out
          tail -n +2 coverage-bin.out >> coverage.out
      # Dependabot PRs cannot read secrets, so the upload must not fail them.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/bkd
          files: coverage.out
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  # godog scenarios driving a real Chrome through chromedp. The runner already
  # has Chrome and chromedp needs no driver.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout.
      - run: go build -mod=vendor -o bin/bkd ./cmd/bkd
      # Pinned, because chromedp's own search would pick the runner's Chromium
      # snapshot ahead of google-chrome.
      - run: google-chrome --version
      - run: go test -count=1 -timeout 20m -v ./...
        working-directory: e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and verify
      # its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
