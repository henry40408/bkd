name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time: a newer push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Replaces `cargo deny`: the licence allow-list below is enforced with
  # go-licenses.
  deps:
    name: deps
    runs-on: ubuntu-latest
    env:
      # The root module allows only these. `e2e/` additionally allows MPL-2.0
      # (godog pulls in go-immutable-radix, go-memdb and golang-lru); MPL-2.0
      # must not reach the root module, which ships in the image.
      ALLOWED_LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MIT-0,Zlib,Unlicense,CC0-1.0,Unicode-3.0,BSL-1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # go-licenses needs GOROOT set explicitly, else it fails on the standard
      # library with "does not have module info". The module's own LICENSE is
      # not a dependency, so it is ignored.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/bkd \
            --allowed_licenses="$ALLOWED_LICENSES"
      # `e2e/` is a separate Go module with its own vendor directory.
      - run: go mod tidy -diff
        working-directory: e2e
      - run: |
          go mod vendor
          test -z "$(git status --porcelain -- vendor go.mod go.sum)"
        working-directory: e2e
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: e2e
      # `--include_tests` because the Gherkin and browser libraries are test
      # dependencies of this module.
      - run: |
          GOROOT="$(go env GOROOT)" go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --include_tests --ignore github.com/henry40408/bkd/e2e \
            --allowed_licenses="$ALLOWED_LICENSES,MPL-2.0"
        working-directory: e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The action only installs the binary: it always runs `golangci-lint run`,
      # which cannot do `fmt`. No `version:` input, so the action picks the
      # linter release itself and dependabot only tracks the action.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
      - run: golangci-lint fmt --diff ./...
      - run: golangci-lint run ./...
      - run: golangci-lint fmt --diff ./...
        working-directory: e2e
      - run: golangci-lint run ./...
        working-directory: e2e
      # CI and the Dockerfile read the Go version from the root go.mod only, so
      # the nested module must not drift from it.
      - run: |
          root="$(grep -E '^(go|toolchain) ' go.mod)"
          nested="$(grep -E '^(go|toolchain) ' e2e/go.mod)"
          test "$root" = "$nested" || { echo "e2e/go.mod differs from go.mod:"; echo "$root"; echo "--"; echo "$nested"; exit 1; }

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -mod=vendor -race ./...

  # Pushes mutate the whole module; pull requests only the lines changed
  # against the base branch. The module has about 1300 mutants, too many for
  # one runner within the timeout, so it is split into shards of about 200-250
  # each. gremlins v0.6.0 takes a single path, so every shard runs `.` and
  # `--exclude-files` removes the files outside its slice. The matrix lists the
  # complement of the slice, as RE2 has no lookahead. Every shard still runs
  # the whole module's tests for coverage, so a mutant covered only by another
  # package's tests is not miscounted as not covered. `e2e/` (a separate module
  # with no coverage profile) and `vendor/` are excluded in every shard. A new
  # package must be added to a shard, or no shard mutates it.
  #
  # Locally, run `GOMAXPROCS=4 nice -n 15 go run
  # github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash --workers 2 .`
  # (the threshold and the e2e/vendor exclusions come from `.gremlins.yaml`).
  mutation-shard:
    name: mutation-shard (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: server-api
            exclude: '^(e2e|vendor|cmd)/|^internal/(assets|auth|backgroundcheck|bookmarks|db|dbtest|importer|linkcheck|netscape|search|sitemeta|truncate|users|version|views)/|^internal/server/(pages|forms|guard|routes|app|cookie|sse|middleware|pageerror)'
          - name: server-pages
            exclude: '^(e2e|vendor|cmd)/|^internal/(assets|auth|backgroundcheck|bookmarks|db|dbtest|importer|linkcheck|netscape|search|sitemeta|truncate|users|version|views)/|^internal/server/(api|service|json|request)'
          - name: auth-users-db
            exclude: '^(e2e|vendor|cmd)/|^internal/(assets|backgroundcheck|bookmarks|dbtest|importer|linkcheck|netscape|search|sitemeta|truncate|server|version|views)/'
          - name: linkcheck
            exclude: '^(e2e|vendor|cmd)/|^internal/(assets|auth|bookmarks|db|dbtest|importer|netscape|search|sitemeta|truncate|server|users|version|views)/'
          - name: bookmarks-netscape-search
            exclude: '^(e2e|vendor|cmd)/|^internal/(assets|auth|backgroundcheck|db|dbtest|linkcheck|server|users|version|views)/'
          - name: views-cmd
            exclude: '^(e2e|vendor)/|^internal/(auth|backgroundcheck|bookmarks|db|importer|linkcheck|netscape|search|sitemeta|truncate|server|users)/'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--diff` needs the base branch's history, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Gremlins derives each mutant's timeout from how long its coverage run
      # took. A cached test result makes that near zero, so nearly every mutant
      # "times out", which the efficacy score ignores: the job would pass
      # without testing anything.
      - run: go clean -testcache
      # Never pass `--test-cpu`: gremlins v0.6.0 builds a single `-cpu 2`
      # argument from it, so every mutant's `go test` fails and counts as
      # killed. GOMAXPROCS limits the CPUs instead.
      - name: Mutate the shard (push)
        if: github.event_name != 'pull_request'
        env:
          GOMAXPROCS: "2"
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          # Stream the output so a killed runner still leaves a log.
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 1 --exclude-files "$SHARD_EXCLUDE" . 2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - name: Mutate the changed lines of the shard (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GOMAXPROCS: "2"
          SHARD_EXCLUDE: ${{ matrix.shard.exclude }}
        run: |
          status=0
          set -o pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --workers 1 --exclude-files "$SHARD_EXCLUDE" \
            --diff "origin/$BASE_REF" . 2>&1 | tee "$RUNNER_TEMP/mutation.log" || status=$?
          set +o pipefail
          # A shard whose diff has no mutable Go line (docs, CI only, or other
          # shards' files) yields zero mutants, which gremlins scores as 0% and
          # so fails the threshold. That is not a low score, so treat it as a
          # pass.
          if [ "$status" -ne 0 ] \
            && grep -q '^Killed: 0, Lived: 0, Not covered: 0$' "$RUNNER_TEMP/mutation.log" \
            && grep -q '^Timed out: 0, ' "$RUNNER_TEMP/mutation.log"; then
            echo "No mutants in the changed lines; nothing to test."
            exit 0
          fi
          exit "$status"
      - name: Upload the mutation log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/mutation.log
          if-no-files-found: ignore

  # The one required check: branch protection names `mutation`, so shards can
  # be added or renamed without touching it. `always()` makes it run (and fail)
  # when a shard fails or is cancelled instead of being skipped.
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    needs: mutation-shard
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.mutation-shard.result }}
        run: |
          echo "mutation shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = success ]

  # Root module only: `e2e/` is its own module, so it is not measured.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # `-coverprofile` ignores the binary cmd/bkd's TestMain execs; with
      # BKD_COVERDIR set it builds that binary with `-cover`.
      - run: |
          BKD_COVERDIR="$PWD/covdata" go test -mod=vendor -coverprofile=coverage.out ./...
          go tool covdata textfmt -i=covdata -o coverage-bin.out
          tail -n +2 coverage-bin.out >> coverage.out
      # Dependabot PRs cannot read secrets, so the upload must not fail them.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: henry40408/bkd
          files: coverage.out
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  # godog scenarios driving a real Chrome through chromedp. The runner already
  # has Chrome and chromedp needs no driver.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Prebuild the server the suite launches, keeping the compile off its
      # timeout.
      - run: go build -mod=vendor -o bin/bkd ./cmd/bkd
      # Pinned, because chromedp's own search would pick the runner's Chromium
      # snapshot ahead of google-chrome.
      - run: google-chrome --version
      - run: go test -count=1 -timeout 20m -v ./...
        working-directory: e2e
        env:
          E2E_CHROME: /usr/bin/google-chrome

  lint-workflow:
    name: lint-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install-action has no actionlint manifest, so download the release and verify
      # its checksum.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" actionlint
      - run: ./actionlint
