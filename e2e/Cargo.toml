[package]
name = "bkd-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser end-to-end tests for bkd"

# Its own workspace, not a member of the root one: `cargo nextest run` at the
# repository root must not compile a WebDriver client or start a browser.
[workspace]

# Line tables keep `file:line` in panic backtraces; full debug info for a test
# crate that statically links thirtyfour and reqwest only costs disk.
[profile.dev]
debug = "line-tables-only"

[dependencies]
anyhow = "1.0.104"
cucumber = "0.23.0"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1.0.151"
tempfile = "3.26.0"
# Pinned exactly, as in rdrs: a bare `cargo update` must not pull a release that
# is still inside the seven-day cooldown for new versions.
thirtyfour = "=0.38.1"
tokio = { version = "1.53.1", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }

[[test]]
name = "e2e"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
