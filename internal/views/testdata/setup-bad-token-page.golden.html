<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set up · bkd</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body><main class="login" id="main"><form class="card" method="post" action="/setup"><h1>Set up bkd</h1><p class="ok-hint">Create the first admin. The setup token is in the server log from when bkd started.</p><p class="err" role="alert">invalid setup token</p><label>Setup token <input type="text" name="token" value="AAAAA-AAAAA" autocomplete="off" autocapitalize="characters" spellcheck="false" required autofocus></label><label>Username <input type="text" name="username" value="alice" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Password <input type="password" name="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Create admin</button></form></main></body></html>
