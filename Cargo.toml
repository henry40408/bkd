[package]
name = "bkd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
